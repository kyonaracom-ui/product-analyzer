    <title>Linepicker · Dropshipping product analyzer</title>
    <script>
      // GitHub Pages project-site SPA fallback (spa-github-pages).
      // 404.html redirects here as /product-analyzer/?/product/12 and this restores the path.
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, "", l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
      try {
        if (localStorage.getItem("dpa-theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="/product-analyzer/assets/index-ClJkJAtX.js"></script>
