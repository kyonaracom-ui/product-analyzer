<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Linepicker</title>
    <script>
      // GitHub Pages serves this file for missing paths and keeps the URL.
      // Redirect to index.html with the path in the query so the app can restore it.
      // https://github.com/rafgraph/spa-github-pages (pathSegmentsToKeep = 1 for /product-analyzer/)
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
